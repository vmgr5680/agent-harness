[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.2.0"
description = "Governance around a Google ADK agent: guardrails, tool scopes, cost ceilings, approvals and evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Govinda Reddy" }]
keywords = ["agents", "google-adk", "gemini", "guardrails", "evals", "observability"]

# ADK is the runtime: the agentic loop, tool dispatch, sub-agents, sessions,
# the human-in-the-loop confirmation gate and OpenTelemetry spans. [db] adds
# DatabaseSessionService, which is what persists the audit trail.
dependencies = [
  "google-adk[db]>=2.9,<3.0",
  # DatabaseSessionService is async-only in ADK 2.9, so SQLAlchemy runs its
  # sync layer through greenlet. google-adk[db] does not pull it in, and
  # without it any AH_SESSION_DB_URL fails at startup rather than at install.
  "greenlet>=3.0",
]

[project.optional-dependencies]
# The HTTP service layer. The package is fully usable without it.
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "httpx>=0.27,<1.0"]
# Connecting to third-party MCP servers. See tools/mcp.py for the defaults.
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "httpx>=0.27,<1.0",
  "fastapi>=0.115,<1.0",
  "mcp>=1.2",
]

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: calls Gemini; skipped unless GOOGLE_API_KEY is set",
]
# Our own deprecations are errors; third-party ones are not. Letting a
# dependency's DeprecationWarning fail collection means an unrelated release
# breaks your test run, which trains people to delete the filter entirely.
filterwarnings = [
  "ignore::DeprecationWarning",
  "error::DeprecationWarning:agent_harness",
]

[tool.mypy]
python_version = "3.12"
packages = ["agent_harness"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_any_generics = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "SLF"]
ignore = [
  # FastAPI dependency injection is function calls in defaults, by design.
  "B008",
  # `class Action(str, Enum)` is deliberate: these values are serialised into
  # JSON responses, log records and database columns, and a plain Enum makes
  # every one of those sites call `.value`. StrEnum would do, but it loses the
  # explicit `str` in the signature that tells a reader why.
  "UP042",
  # `Generic[T]` rather than PEP 695 type parameters: the cache is generic over
  # a value type that callers annotate, and the older spelling reads better to
  # people who have not yet moved to 3.12 syntax.
  "UP046",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals on purpose, to pin behaviour that has no public
# surface (a substituted tool fixture, a direct DELETE to prove the cascade).
"tests/*" = ["SLF001"]
# The system prompt's JSON examples must stay on one line: the model copies
# what it is shown, and a wrapped example teaches it to emit a wrapped one.
"src/agent_harness/harness/planner.py" = ["E501"]

[tool.coverage.run]
source = ["agent_harness"]
branch = true

# uvicorn is imported lazily in cli.py and ships no stubs.
[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true
